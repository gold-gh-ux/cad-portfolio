<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CAD Portfolio | しろー</title>
  <meta name="description" content="しろーのCADポートフォリオ。2D・3D CADによる制作例を掲載しています。">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- HERO HEADER -->
  <header class="bg-slate-900 text-white py-16 px-4 sm:px-6 lg:px-8 text-center shadow-md">
    <div class="max-w-4xl mx-auto">
      <p class="text-xs font-semibold uppercase tracking-widest text-sky-400 mb-2">CAD Portfolio</p>
      <h1 class="text-4xl sm:text-5xl font-bold tracking-tight mb-3">しろー</h1>
      <p class="text-lg text-slate-300 font-light">Mechanical Design / CAD</p>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-grow w-full">

    <section class="mb-12">
      <!-- SECTION HEADING -->
      <div class="mb-8 border-b border-slate-200 pb-4">
        <p class="text-xs font-semibold uppercase tracking-widest text-sky-600 mb-1">Works</p>
        <h2 class="text-2xl font-bold text-slate-900">CAD制作例</h2>
      </div>

      <!-- WORKS GRID -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

        <!-- WORK ITEM 01 -->
        <article class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow duration-300 flex flex-col">
          <a href="images/001.jpg" target="_blank" class="block aspect-video bg-slate-100 overflow-hidden relative group">
            <img src="images/001.jpg" alt="機械部品図 #01" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
            <div class="absolute inset-0 bg-slate-900/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-sm font-medium">
              拡大表示
            </div>
          </a>

          <div class="p-6 flex flex-col justify-between flex-grow">
            <div>
              <h3 class="text-xl font-bold text-slate-900 mb-3">機械部品図 #01</h3>
              <p class="text-slate-600 text-sm leading-relaxed mb-6">
                2D CADを使用して作成した機械部品図です。寸法・形状などを確認しながら作図しています。
              </p>
            </div>

            <dl class="grid grid-cols-3 gap-2 pt-4 border-t border-slate-100 text-xs">
              <div>
                <dt class="text-slate-400 font-medium mb-0.5">使用CAD</dt>
                <dd class="text-slate-700 font-semibold">AutoCAD</dd>
              </div>
              <div>
                <dt class="text-slate-400 font-medium mb-0.5">分野</dt>
                <dd class="text-slate-700 font-semibold">機械設計</dd>
              </div>
              <div>
                <dt class="text-slate-400 font-medium mb-0.5">制作年</dt>
                <dd class="text-slate-700 font-semibold">2026</dd>
              </div>
            </dl>
          </div>
        </article>

        <!-- WORK ITEM 02 -->
        <article class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow duration-300 flex flex-col">
          <a href="images/002.jpg" target="_blank" class="block aspect-video bg-slate-100 overflow-hidden relative group">
            <img src="images/002.jpg" alt="機械部品図 #02" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
            <div class="absolute inset-0 bg-slate-900/10 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white text-sm font-medium">
              拡大表示
            </div>
          </a>

          <div class="p-6 flex flex-col justify-between flex-grow">
            <div>
              <h3 class="text-xl font-bold text-slate-900 mb-3">機械部品図 #02</h3>
              <p class="text-slate-600 text-sm leading-relaxed mb-6">
                CADを使用して作成した機械部品図です。
              </p>
            </div>

            <dl class="grid grid-cols-3 gap-2 pt-4 border-t border-slate-100 text-xs">
              <div>
                <dt class="text-slate-400 font-medium mb-0.5">使用CAD</dt>
                <dd class="text-slate-700 font-semibold">AutoCAD</dd>
              </div>
              <div>
                <dt class="text-slate-400 font-medium mb-0.5">分野</dt>
                <dd class="text-slate-700 font-semibold">機械設計</dd>
              </div>
              <div>
                <dt class="text-slate-400 font-medium mb-0.5">制作年</dt>
                <dd class="text-slate-700 font-semibold">2026</dd>
              </div>
            </dl>
          </div>
        </article>

      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs">
    <div class="max-w-6xl mx-auto px-4">
      <p>&copy; 2026 Shiro</p>
    </div>
  </footer>

</body>
</html>
